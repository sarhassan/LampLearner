<!doctype html>  
<html lang="en">  
<head>  
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width,initial-scale=1">  
  <title>Lamp Learner</title>  
  <link rel="stylesheet" href="css/styles.css">  
</head>  
<body class="landing-body">  
  <main class="landing-shell">  
    <section class="splash-screen" id="splashScreen">  
      <div class="splash-card">  
        <div class="sparkle">✨</div>  
        <h1>Welcome to the Lamp Learner!</h1>  
        <p>Slit lamp training, but make it cute.</p>  
      </div>  
    </section>

    <section class="intro-panel hidden" id="introPanel">  
      <div class="intro-card">  
        <small class="eyebrow">INTERACTIVE LEARNING</small>  
        <h2>Learn how to use the slit lamp with confidence</h2>  
        <p>  
          Start with mechanics, complete the interactive quiz, and then move on  
          to anterior and posterior segment learning.  
        </p>

        <div class="overall-progress-bar home-progress">  
          <div class="overall-progress-inner">  
            <small>Overall course progress</small>  
            <div class="overall-track">  
              <i id="overallProgressFill"></i>  
            </div>  
            <strong id="overallProgressText">0%</strong>  
          </div>  
        </div>

        <a href="mechanics.html" class="continue-btn">Start Module 1</a>  
      </div>  
    </section>  
  </main>

  <script src="js/progress.js"></script>  
  <script>  
    const splash = document.getElementById("splashScreen");  
    const intro = document.getElementById("introPanel");

    setTimeout(() => {  
      splash.classList.add("fade-away");  
      setTimeout(() => {  
        splash.style.display = "none";  
        intro.classList.remove("hidden");  
        intro.classList.add("fade-in");  
      }, 900);  
    }, 2000);

    renderCourseProgress();  
  </script>  
</body>  
</html>

<!doctype html>  
<html lang="en">  
<head>  
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width,initial-scale=1">  
  <title>Lamp Learner — Posterior</title>  
  <link rel="stylesheet" href="css/styles.css">  
</head>  
<body class="module-page-body">  
  <main class="simple-module-page">  
    <div class="simple-card glass">  
      <small class="eyebrow">MODULE 3</small>  
      <h1>Posterior</h1>  
      <p>This module page is ready for your posterior segment content.</p>

      <div class="overall-progress-card">  
        <div class="overall-progress-top">  
          <span>Overall completeness</span>  
          <strong id="overallProgressText">0%</strong>  
        </div>  
        <div class="overall-track">  
          <i id="overallProgressFill"></i>  
        </div>  
      </div>

      <div class="simple-actions">  
        <a href="index.html" class="cute-btn secondary-btn">Back home</a>  
        <button id="completePosterior" class="cute-btn primary-btn">Mark posterior complete</button>  
      </div>  
    </div>  
  </main>

  <script src="js/progress.js"></script>  
  <script>  
    protectModuleAccess("posterior");  
    renderCourseProgress();

    document.getElementById("completePosterior").addEventListener("click", () => {  
      markCourseStepComplete("posterior");  
      renderCourseProgress();  
      alert("Posterior marked complete.");  
    });  
  </script>  
</body>  
</html>
